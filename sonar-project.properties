sonar.projectKey=contact-management-system
sonar.projectName=Contact Management System
sonar.projectVersion=0.0.1-SNAPSHOT

# Source directories
sonar.sources=src/main/java,frontend/src
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Coverage report
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/*.min.js

# Language settings
sonar.java.source=25
sonar.javascript.node.maxspace=4096

# Host (update token before running)
sonar.host.url=http://localhost:9000
# sonar.token=<your-sonarqube-token-here>

# Encoding
sonar.sourceEncoding=UTF-8
