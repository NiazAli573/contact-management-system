spring:
  application:
    name: contact-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/contactsdb
    username: postgres
    password: ${DB_PASSWORD:nas13041}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  web:
    cors:
      allowed-origins: "http://localhost:5173"

app:
  jwt:
    secret: ${JWT_SECRET:Y29udGFjdE1hbmFnZW1lbnRTeXN0ZW1TZWNyZXRLZXkyMDI2UHJvZHVjdGlvbkp3dA==}
    expiration: 86400000   # 24 hours in milliseconds

logging:
  level:
    com.contactmanager: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  file:
    name: logs/contact-management.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
