spring:
  datasource:
    url: jdbc:h2:file:./data/contactsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: "Y29udGFjdE1hbmFnZW1lbnRTeXN0ZW1TZWNyZXRLZXkyMDI2UHJvZHVjdGlvbkp3dA=="
    expiration: 86400000

logging:
  level:
    com.contactmanager: DEBUG
    org.springframework.security: INFO
  file:
    name: logs/contact-management.log
